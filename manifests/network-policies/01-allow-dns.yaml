# Sin esto, el default-deny también bloquea la resolución DNS y las apps no
# arrancan bien (aunque no la necesiten para este demo, es requisito real en
# cualquier app). Egress permitido únicamente hacia los pods de CoreDNS
# (namespace kube-system + podSelector k8s-app=kube-dns, no todo el
# namespace) - más estricto que solo filtrar por namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: frontend
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
