# EJEMPLO de referencia — NO contiene secretos reales.
# Forma alternativa a scripts/install.sh (--set) para entregar el webhook de
# Slack a Falcosidekick: crear este Secret con el valor real (fuera de git)
# y referenciarlo en helm/chart/values.yaml con
# falcosidekick.config.existingSecret=falcosidekick-slack.
apiVersion: v1
kind: Secret
metadata:
  name: falcosidekick-slack
  namespace: falco
type: Opaque
stringData:
  SLACK_WEBHOOKURL: "https://hooks.slack.com/services/REEMPLAZAR/CON/TU_WEBHOOK"
